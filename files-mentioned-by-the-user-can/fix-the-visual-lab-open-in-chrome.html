  <title>Fix the Visual Lab</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#14213d;background:linear-gradient(rgba(23,37,84,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(23,37,84,.035) 1px,transparent 1px),linear-gradient(135deg,#edf4ef 0%,#e7eef7 46%,#f4efe5 100%);background-size:34px 34px,34px 34px,auto} button{font:inherit}.page{max-width:1500px;margin:0 auto;padding:22px;display:grid;gap:18px}.card{background:rgba(255,255,255,.84);border:1px solid #d9e2ec;border-radius:12px;box-shadow:0 18px 50px rgba(17,24,39,.09);backdrop-filter:blur(10px)}.top{overflow:hidden}.top:before{content:"";display:block;height:8px;background:linear-gradient(90deg,#06b6d4,#10b981,#f59e0b,#8b5cf6)}.top-inner{padding:22px}.top-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.eyebrow{margin:0;color:#1d4ed8;font-weight:900;text-transform:uppercase;letter-spacing:.04em}h1{margin:4px 0 6px;font-size:clamp(36px,4vw,58px);line-height:1;color:#0f172a}.subtitle{margin:0;font-size:22px;color:#526174}.case{padding:14px 16px;text-align:right;background:rgba(255,255,255,.8)}.case small{display:block;color:#64748b;font-weight:900;text-transform:uppercase}.case strong{display:block;margin-top:4px;font-size:24px;color:#0f172a}.case span{color:#64748b}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.score{border:1px solid #e2e8f0;border-radius:10px;background:white;padding:12px 14px}.score-head{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:900;color:#475569}.track{height:12px;background:#eef2f7;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;transition:width .7s ease}.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px}.visual-wrap{padding:16px}.brief{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#0f172a;color:white;border-radius:10px;padding:13px 16px;margin-bottom:14px}.brief small{color:#cffafe;background:rgba(255,255,255,.1);border-radius:6px;padding:5px 10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.brief div{font-size:22px;font-weight:900}.visual{min-height:500px;border:1px solid #e2e8f0;border-radius:10px;background:#fbfcf8;padding:22px}.visual h2{margin:0;font-size:32px;color:#0f172a}.visual p{margin:6px 0 0;font-size:19px;color:#64748b;font-weight:700}.panel{padding:20px;display:flex;flex-direction:column;gap:13px}.panel h2{margin:0;font-size:30px;color:#0f172a}.actions{display:grid;gap:10px}.action{min-height:54px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #dbe3ee;background:white;color:#1e293b;border-radius:10px;padding:12px 14px;font-weight:900;cursor:pointer;text-align:left;transition:.2s}.action:hover{transform:translateY(-2px);border-color:#93c5fd;background:#eff6ff}.action.good{border-color:#a7f3d0;background:#ecfdf5;color:#047857;transform:none}.action.bad{border-color:#fcd34d;background:#fffbeb;color:#92400e;transform:none}.badge{display:grid;place-items:center;min-width:28px;height:28px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:14px}.good .badge{background:#10b981;color:white}.bad .badge{background:#f59e0b;color:white}.feedback{min-height:64px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:14px;font-size:17px;color:#475569;font-weight:700}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #cbd5e1;background:white;color:#334155;border-radius:10px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:white;border-color:#2563eb}.btn:disabled{background:#cbd5e1;border-color:#cbd5e1;cursor:not-allowed}.label{fill:#64748b;font-weight:900;font-size:14px}.value{fill:#0f172a;font-weight:900;font-size:18px}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.kpi{border:1px solid #dbe3ee;border-radius:10px;padding:16px;background:#eff6ff}.kpi:nth-child(2n){background:#ecfdf5}.kpi:nth-child(3n){background:#fffbeb}.quiet .kpi{background:white!important}.kpi strong{display:block;margin-top:8px;font-size:30px;color:#0f172a}.main-card{border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;padding:18px;margin-top:15px}.main-card small{color:#1d4ed8;font-weight:900;text-transform:uppercase}.main-card strong{display:block;margin-top:4px;font-size:30px;color:#0f172a}.final{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.final .card{width:min(980px,100%);padding:52px}.ok{margin:0 auto 20px;display:grid;place-items:center;width:82px;height:82px;border-radius:999px;background:#d1fae5;color:#047857;font-weight:900;font-size:25px}.total{width:min(430px,100%);margin:26px auto;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:24px}.total strong{display:block;margin-top:4px;font-size:72px;color:#0f172a}@media(max-width:1100px){.layout{grid-template-columns:1fr}.scores,.kpi-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.page{padding:12px}.scores,.buttons,.kpi-grid{grid-template-columns:1fr}.case{text-align:left}}
    .levelnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.levelnav button{border:1px solid #cbd5e1;background:white;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer}.levelnav button.active{background:#0f172a;color:white;border-color:#0f172a}.attempts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.attempt{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:10px 14px;font-weight:900;color:#334155}.attempt b{font-size:24px;color:#0f172a;margin-left:8px}.attempt.good b{color:#059669}.attempt.bad b{color:#dc2626}.context,.goal{margin-bottom:14px;border:1px solid #e2e8f0;background:rgba(255,255,255,.86);border-radius:10px;padding:14px 16px;font-size:18px;line-height:1.45;color:#475569;font-weight:800}.goal{border-color:#bfdbfe;background:#eff6ff;color:#1e293b}.goal small{margin-right:8px;color:#1d4ed8;text-transform:uppercase;letter-spacing:.04em}.axis-title{fill:#64748b;font-weight:900;font-size:13px}.css-chart{height:360px;margin-top:22px;display:grid;grid-template-columns:64px 1fr;gap:14px}.y-axis{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;color:#64748b;font-weight:900;font-size:13px;padding:6px 0 34px}.plot{position:relative;height:360px;border-left:2px solid #cbd5e1;border-bottom:2px solid #cbd5e1;background:repeating-linear-gradient(to top,#e2e8f0 0,#e2e8f0 1px,transparent 1px,transparent 64px);display:flex;align-items:flex-end;justify-content:space-around;padding:0 24px 0 24px}.bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}.bar-value{font-weight:900;color:#0f172a}.bar-col{width:74px;border-radius:10px 10px 0 0;background:#2563eb;transition:height .5s ease,background .3s ease}.bar-label{height:26px;font-weight:900;color:#475569}.scatter{position:relative;height:390px;margin-top:20px;border-left:2px solid #cbd5e1;border-bottom:2px solid #cbd5e1;background:repeating-linear-gradient(to top,#e2e8f0 0,#e2e8f0 1px,transparent 1px,transparent 74px),white;border-radius:10px}.dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#2563eb;border:3px solid white;box-shadow:0 3px 10px rgba(15,23,42,.25);z-index:3}.trend{position:absolute;height:9px;background:#0f172a;border:3px solid white;border-radius:999px;transform-origin:left center;left:64px;top:92px;width:540px;transform:rotate(28deg);box-shadow:0 3px 10px rgba(15,23,42,.28);z-index:2}
  </style>

<script>
const levels=[
{id:"dramatic-improvement",title:"The Dramatic Improvement",cat:"Trust Check",theme:"Festival satisfaction",goal:"Show the improvement honestly.",prompt:"Does the design make the improvement feel bigger than it is?",context:"The festival team wants to show that students are happier this year. Not every visual in this game is completely wrong. Sometimes the data is correct, but the design creates the wrong story for the goal or audience.",note:"For this bar chart, the scale and colour make the change feel more dramatic than it is. The data stays the same, but the story feels different.",base:{clarity:48,trust:34,audience:66,message:46},done:"For this bar chart, the scale and colour make the change feel more dramatic than it is. The data stays the same, but the story feels different.",spot:[["scale","The scale and colour make the change feel dramatic",1,"For this goal, this is a stronger choice."],["wrong","The values are probably incorrect",0,"The numbers can be correct, while the design still changes the story."],["simple","The chart is too simple for students",0,"Simple can be useful. The bigger issue here is scale and colour."]],actions:[["axis-zero","Start the y-axis at 0",1,"This repair makes the size of the improvement easier to trust.",{trust:28,clarity:12}],["positive-color","Use a positive colour for the best score",1,"The colour signal now fits the story better.",{trust:14,clarity:14,message:8}],["neutral-caption","Add a neutral caption",1,"A neutral caption helps the audience read the change calmly.",{trust:12,message:12}],["celebrate","Add celebration graphics",0,"This could work in another context, but it adds emotion instead of fixing the main issue here."],["hide-axis","Remove the axis",0,"The axis gives useful evidence. Removing it makes the story harder to check."],["big-title","Make the title huge",0,"A bigger title may change attention, but it does not repair the scale or colour signal."]]},
{id:"busy-dashboard",title:"The Busy Dashboard",cat:"Clarity Check",theme:"Student life dashboard",goal:"Help the team find the main issue quickly.",prompt:"Where should the eye go first?",context:"A student support team opens this dashboard every morning. It has useful information, but the first version does not make the next step easy to find.",note:"The dashboard is not useless. It has useful information. But the first version does not guide the eye.",base:{clarity:30,trust:56,audience:42,message:34},done:"The dashboard is not useless. It has useful information. But the first version does not guide the eye.",spot:[["no-priority","Everything looks equally important",1,"For this goal, hierarchy is the strongest issue to repair."],["not-enough","There is not enough information",0,"The dashboard has enough information. The issue is that it does not guide the eye."],["wrong-chart","The chart type is the main problem",0,"The bigger issue is priority, not one chart type."]],choices:[{id:"priority",title:"Choose one main message",options:[["attendance","Main insight: Attendance dropped by 2.1 points",1,"For this goal, this gives the team a clear first move.",{clarity:22,message:20}],["green","Green points reached 9,842",0,"This is useful information, but it is not the strongest action signal here."],["apps","App opens reached 31K",0,"This may matter in another goal, but it does not help the team find the main issue quickly."]]}],actions:[["attendance-priority","Choose one main message",1,"Now the dashboard has a clear first place to look.",{clarity:22,message:20}],["group-info","Group supporting cards",1,"Grouping helps the audience scan the dashboard faster.",{clarity:20,audience:14}],["reduce-noise","Turn down visual noise",1,"This repair makes the main message easier to see.",{clarity:18,trust:18}],["more-badges","Add more badges",0,"More badges may feel active, but they make the dashboard compete with itself."],["bigger-all","Make every number bigger",0,"If every number gets louder, the main message still has no clear place."],["more-colours","Use more colours",0,"More colour can add noise when the goal is quick focus."]]},
{id:"expert-beginner",title:"The Wrong Audience View",cat:"Audience Check",theme:"Student budget spending",goal:"Help a student understand where their monthly budget goes.",prompt:"Who is this visual made for?",context:"A monthly budget view can be correct but still hard to use. A student needs the main spending story first.",note:"The data was correct, but the first view did not fit the audience. A student needs the main spending story first.",base:{clarity:38,trust:66,audience:26,message:34},done:"The data was correct, but the first view did not fit the audience. A student needs the main spending story first.",choices:[{id:"audience",title:"Choose the audience",options:[["student","Student",1,"For this goal, the student needs the spending story first.",{audience:24}],["finance","Finance office",0,"A finance office may need a dense table, but that is not the goal here."],["analyst","Data analyst",0,"A data analyst may need detail, but a student needs the main takeaway first."]]},{id:"first",title:"Best first message",options:[["rent","Rent takes the biggest part of the budget",1,"This gives the student the main spending story first.",{clarity:24,audience:24,message:18}],["ledger","Expense ledger by monthly category",0,"This is accurate, but it feels more like an admin view than a student view."],["total","Total monthly spending is EUR 1,215",0,"The total is useful, but it does not show where the money goes."]]}],actions:[["student-headline","Add a student-friendly headline",1,"This repair makes the main budget story clear for a student.",{audience:18,message:14}],["highlight-rent","Highlight the biggest spending category",1,"Rent now stands out as the biggest part of the budget.",{clarity:18,message:16}],["group-labels","Use clearer labels and grouped categories",1,"The labels now help the student compare spending areas faster.",{clarity:16,audience:12}],["finance-terms","Add more financial terms",0,"This could fit a finance report, but it does not help a student understand the story quickly."],["bright-slices","Make every slice a different bright colour",0,"More colours can make the donut harder to read when every category competes."],["hide-amounts","Hide the amounts",0,"The amounts help the student judge where savings may be possible."]]},
{id:"careful-title",title:"The Careful Title",cat:"Story Check",theme:"Screen time and grades",goal:"Avoid overclaiming the story.",prompt:"What can this chart safely claim?",context:"A student magazine wants a strong headline. The data shows a clear relationship, but the title could still claim more than the data proves.",note:"The relationship is visible, but the title decides how strong the story feels. A fair title says linked, not caused.",base:{clarity:54,trust:30,audience:52,message:30},done:"The relationship is visible, but the title decides how strong the story feels. A fair title says linked, not caused.",choices:[{id:"headline",title:"Choose the fairest headline",options:[["destroy","Phones are destroying grades",0,"This headline is strong, but it claims more than the data proves."],["linked","More screen time is linked to lower grades",1,"For this goal, this headline is strong but still careful.",{trust:36,message:30}],["cause","Screen time causes students to fail",0,"Even a strong relationship does not prove that screen time is the cause."]]}],actions:[["careful-headline","Use the careful headline",1,"The title now says what the chart can safely claim.",{trust:22,message:22}],["cause-note","Add: this shows a relationship, not proof of cause and effect",1,"This note keeps the strong pattern, but avoids overclaiming the cause.",{trust:26,audience:12}],["red-warning","Make the trend line red",0,"Red makes the story feel more alarming than this goal needs."],["remove-dots","Hide the data points",0,"The points help the audience see the evidence behind the trend."],["warning-icon","Use a dramatic warning icon",0,"A warning icon adds drama, but it does not make the claim more fair."]]},
{id:"missing-comparison",title:"The Missing Comparison",cat:"Context Check",theme:"Student club popularity",goal:"Compare clubs fairly.",prompt:"Bigger total, or fairer comparison?",context:"The school wants to fund popular clubs. Raw members show which club is biggest. Percentage of capacity shows which club is most full.",note:"Raw totals are useful, but they answer a different question. For a fair comparison, capacity gives important context.",base:{clarity:44,trust:38,audience:50,message:42},done:"Raw totals are useful, but they answer a different question. For a fair comparison, capacity gives important context.",choices:[{id:"view",title:"Choose the fairer view for this goal",options:[["raw","Show raw members",0,"Raw members answer which club is biggest. This goal needs a fairer capacity comparison."],["capacity","Show percentage of capacity",1,"This compares clubs more fairly for this goal.",{trust:30,clarity:18,message:16}],["alphabet","Sort alphabetically only",0,"Sorting can help scanning, but it does not add the missing context."]]}],actions:[["add-capacity","Add capacity context",1,"The audience can now see how full each club is.",{trust:18,audience:14}],["fair-note","Add a fair comparison note",1,"The note explains why the comparison changed.",{clarity:12,message:12}],["hide-small","Hide smaller clubs",0,"Smaller clubs may be very full, so hiding them removes useful context."],["bright-biggest","Make the biggest bar brighter",0,"This makes the raw total stand out more, but it does not answer the fairness question."],["more-colours","Use more colours",0,"More colour does not add the missing comparison context."]]},
{id:"audience-design",title:"Design for the Audience",cat:"Audience Check",theme:"Cafeteria feedback",goal:"Help the cafeteria manager choose what to improve next month.",prompt:"Same data, different user.",context:"The same cafeteria survey goes to a manager, students and a data analyst. No version is always best. The best version depends on the goal and audience.",note:"No version is always best. For this goal, the manager needs the problem area and action priority first.",base:{clarity:46,trust:60,audience:30,message:44},done:"No version is always best. For this goal, the manager needs the problem area and action priority first.",choices:[{id:"audience",title:"Choose audience",options:[["manager","Cafeteria manager",1,"For this goal, the manager needs action priority.",{audience:18}],["students","Students",0,"Students may need a simple promise view, but that is not the goal of this level."],["analyst","Data analyst",0,"Analysts need detail and method, but the current goal is a manager decision."]]},{id:"version",title:"Best version for the selected goal",options:[["priority","Problem areas and action priority",1,"This repair makes the next action clear for the manager.",{clarity:20,audience:30,message:18}],["poster","Simple poster with what will improve",0,"This could fit students, but it gives the manager less decision detail."],["raw-table","Detailed analyst table as the main view",0,"Useful for analysis, but slower for a manager choosing the next improvement."]]}],actions:[["manager-priority-board","Show manager priority board",1,"The manager can now see what to improve first.",{clarity:20,audience:20,message:16}],["show-sample","Keep sample info in small text",1,"Trust detail stays available without taking over the main message.",{trust:14}],["hide-waiting","Hide waiting time",0,"Waiting time is the main problem area for this goal."],["all-equal","Make all topics equal",0,"Equal emphasis hides the action priority the manager needs."]]},
{id:"honest-ranking",title:"The Honest Ranking",cat:"Trust Check",theme:"Student satisfaction ranking",goal:"Avoid making close results look like a clear winner.",prompt:"Winner, or basically close?",context:"The school wants to publish a ranking of campus services. The scores are close, so the design must avoid making the winner look too certain.",note:"Sometimes the honest story is not 'number one wins'. Sometimes the honest story is that the results are very close.",base:{clarity:50,trust:34,audience:52,message:36},done:"Sometimes the honest story is not 'number one wins'. Sometimes the honest story is that the results are very close.",choices:[{id:"message",title:"Choose the more careful message",options:[["winner","Library is the clear winner",0,"The difference is small, so this message feels too certain."],["close","The scores are close. The exact ranking may not be meaningful.",1,"For this goal, this is a stronger and more careful choice.",{trust:32,message:30}],["worst","Study rooms are failing",0,"This overstates a small gap."]]}],actions:[["uncertainty","Add uncertainty ranges",1,"The ranking now shows that the exact order is not certain.",{clarity:16,trust:22}],["careful-message","Add a careful message",1,"This repair makes the story less overconfident.",{trust:16,message:12}],["remove-winner","Remove strong winner styling",1,"The visual no longer pushes Library as a clear winner.",{clarity:10,message:14}],["gold","Add a gold medal to Library",0,"A medal makes the winner feel more certain than the data supports."],["rank-colours","Use harsher rank colours",0,"Harsh colours add drama without adding evidence."],["remove-percentages","Remove the percentages",0,"The percentages help the audience see how close the scores are."]]}
];
const state={level:0,applied:[],order:[],choices:{},feedback:"",result:false,hint:false,scores:[],attempts:{},appliedBy:{},resultBy:{},orderBy:{}}; const app=document.querySelector("#app"); const has=id=>state.applied.includes(id); const key=(l,g)=>`${l}:${g}`; const pick=(g)=>state.choices[key(levels[state.level].id,g)]; const clamp=n=>Math.max(0,Math.min(100,n)); const shuffle=a=>[...a].sort(()=>Math.random()-.5); state.order=levelOrder(levels[0]);
function add(s,d={}){return{clarity:clamp(s.clarity+(d.clarity||0)),trust:clamp(s.trust+(d.trust||0)),audience:clamp(s.audience+(d.audience||0)),message:clamp(s.message+(d.message||0))}}
function score(){const l=levels[state.level];let s={...l.base};(l.actions||[]).forEach(a=>{if(a[2]&&has(a[0])&&a[4])s=add(s,a[4])});choiceEntries(l).forEach(({group,o})=>{if(state.choices[key(l.id,group)]===o[0]&&o[2]&&o[4])s=add(s,o[4])});return s}
function choiceEntries(l){return[...(l.spot||[]).map(o=>({group:"spot",o})),...(l.choices||[]).flatMap(c=>c.options.map(o=>({group:c.id,o})))]}
function complete(){const l=levels[state.level];return (l.actions||[]).filter(a=>a[2]).every(a=>has(a[0]))&&choiceEntries(l).filter(x=>x.o[2]).every(x=>state.choices[key(l.id,x.group)]===x.o[0])}
function levelOrder(l){if(!state.orderBy[l.id])state.orderBy[l.id]=shuffle((l.actions||[]).map(a=>a[0]));return state.orderBy[l.id]}
function enterLevel(i){state.level=i;const l=levels[state.level];state.applied=state.appliedBy[l.id]||[];state.order=levelOrder(l);state.result=!!state.resultBy[l.id];state.feedback=""}
function totals(){const vals=Object.values(state.attempts);const good=vals.filter(Boolean).length,wrong=vals.length-good;return{good,wrong,total:vals.length,accuracy:vals.length?Math.round(good/vals.length*100):0}}
function record(kind,id,correct){const l=levels[state.level];const attemptKey=`${l.id}:${kind}:${id}`;if(state.attempts[attemptKey]===undefined)state.attempts[attemptKey]=!!correct}
function attemptSummary(){const t=totals();return`<div class=attempts><div class="attempt good">Helpful <b>${t.good}</b></div><div class="attempt bad">Less useful <b>${t.wrong}</b></div><div class=attempt>Fit score <b>${t.accuracy}%</b></div></div>`}
function apply(id){if(state.result||has(id))return;const l=levels[state.level],a=l.actions.find(x=>x[0]===id);record("action",id,a[2]);state.applied=[...state.applied,id];state.appliedBy[l.id]=state.applied;state.feedback=a[3];render()}
function choose(group,id){if(state.result)return;const l=levels[state.level];if(state.choices[key(l.id,group)]===id)return;const o=choiceEntries(l).find(x=>x.group===group&&x.o[0]===id).o;record("choice",`${group}:${id}`,o[2]);state.choices[key(l.id,group)]=id;state.feedback=o[3]|| (o[2]?"Good choice.":"Try reading the story again.");render()}
function reset(){const l=levels[state.level];state.applied=[];state.appliedBy[l.id]=[];state.resultBy[l.id]=false;delete state.scores[state.level];choiceEntries(l).forEach(x=>delete state.choices[key(l.id,x.group)]);state.orderBy[l.id]=shuffle((l.actions||[]).map(a=>a[0]));state.order=state.orderBy[l.id];state.result=false;state.feedback="";render()}
function showResult(){const l=levels[state.level],s=score();state.result=true;state.resultBy[l.id]=true;state.feedback=l.done;state.scores[state.level]=Math.round((s.clarity+s.trust+s.audience+s.message)/4);render()}
function next(){if(!state.result)return;if(state.level===levels.length-1)return final();enterLevel(state.level+1);render()}
function jump(i){enterLevel(i);render()}
function scoreBars(s){return[["clarity","Clarity","#0ea5e9"],["trust","Trust","#10b981"],["audience","Audience Fit","#f59e0b"],["message","Message Strength","#8b5cf6"]].map(([k,l,c])=>`<div class=score><div class=score-head><span>${l}</span><b>${s[k]}%</b></div><div class=track><div class=fill style="width:${s[k]}%;background:${c}"></div></div></div>`).join("")}
function choicePanel(title,group,options){const l=levels[state.level];return`<section class="card panel"><h2>${title}</h2><div class=actions>${options.map(o=>{const picked=state.choices[key(l.id,group)]===o[0];const cls=picked?(o[2]?"good":"bad"):"";return`<button class="action ${cls}" onclick="choose('${group}','${o[0]}')"><span>${o[1]}${picked?`<small style="display:block;margin-top:6px;text-transform:uppercase;letter-spacing:.04em">${o[2]?"Helpful":"Less useful"}</small>`:""}</span><span class=badge>${picked?(o[2]?"Fit":"!"):"?"}</span></button>`}).join("")}</div></section>`}
function repairPanel(l){const ordered=state.order.map(id=>l.actions.find(a=>a[0]===id)).filter(Boolean),rec=ordered.filter(a=>a[2]).map(a=>a[1]).join(", ");return`<aside class="card panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><h2>Repair choices</h2><button class=btn onclick="state.hint=!state.hint;render()">Hint</button></div>${state.hint?`<div class=feedback><b>Presenter hint</b><br>Recommended: ${rec}<br>${l.note}</div>`:""}<div class=actions>${ordered.map(a=>{const clicked=has(a[0]);const cls=clicked?(a[2]?"good":"bad"):"";return`<button class="action ${cls}" onclick="apply('${a[0]}')"><span>${a[1]}</span><span class=badge>${clicked?(a[2]?"Fit":"!"):"+"}</span></button>`}).join("")}</div>${state.feedback?`<div class=feedback>${state.feedback}</div>`:""}<div class=buttons><button class=btn onclick=reset()>Reset level</button>${complete()&&!state.result?`<button class="btn primary" onclick=showResult()>Show result</button>`:`<button class="btn primary" onclick="state.level===levels.length-1?final():jump(state.level+1)">${state.level===levels.length-1?"Final screen":"Next level"}</button>`}</div></aside>`}
function side(l){return`${l.spot?choicePanel("Spot it","spot",l.spot):""}${(l.choices||[]).map(c=>choicePanel(c.title,c.id,c.options)).join("")}${repairPanel(l)}`}
function visual(){const l=levels[state.level];if(l.id==="dramatic-improvement")return chart();if(l.id==="busy-dashboard")return dashboard();if(l.id==="missing-comparison")return club();if(l.id==="audience-design")return cafeteria();if(l.id==="honest-ranking")return ranking();if(l.id==="careful-title")return titleCase();return report()}
function chart(){const z=has("axis-zero"),green=has("positive-color"),cap=has("neutral-caption"),yMin=z?0:74,yMax=z?100:82,ticks=z?[100,75,50,25,0]:[82,80,78,76,74],data=[["Q1",76],["Q2",78],["Q3",79],["Q4",80]];return`<div class=visual><h2>Festival Satisfaction</h2><p>Bar chart - 76 to 80 - axis starts at ${yMin}</p><div class=css-chart><div class=y-axis>${ticks.map(t=>`<span>${t}</span>`).join("")}</div><div class=plot>${data.map(d=>{const px=Math.max(10,((d[1]-yMin)/(yMax-yMin))*320),color=d[0]==="Q4"?(green?"#10b981":"#dc2626"):"#2563eb";return`<div class=bar-wrap><div class=bar-value>${d[1]}</div><div class=bar-col style="height:${px}px;background:${color}"></div><div class=bar-label>${d[0]}</div></div>`}).join("")}</div></div>${cap?`<div class=feedback>Satisfaction increased from 76 to 80. The improvement is real, but small.</div>`:""}</div>`}
function dashboard(){const pr=has("attendance-priority"),group=has("group-info"),quiet=has("reduce-noise"),cards=[["Attendance","87.6%","-2.1 pts"],["Support tickets","156","+18"],["Stress check-ins","41%","+6 pts"],["Late assignments","128","+22"],["Room issues","19","open"],["Sleep score","6.1","/10"],["Event signups","612","+9%"],["Peer mentors","27","active"]];return`<div class="visual ${quiet?"quiet":""}"><h2>Student Support Dashboard</h2><p>Morning overview</p>${pr?`<div class=main-card><small>Main insight</small><strong>Attendance dropped by 2.1 points.</strong></div>`:""}<div class=kpi-grid>${cards.map(c=>`<div class=kpi><small>${c[0]}</small><strong>${c[1]}</strong><div style="margin-top:8px;font-weight:900;color:#64748b">${c[2]}</div></div>`).join("")}</div><div style="display:grid;grid-template-columns:repeat(${quiet?2:4},1fr);gap:12px;margin-top:14px">${["Attendance trend","Support pressure",...(quiet?[]:["Event signups","Room issues"])].map((t,i)=>`<div class=score><small style="font-weight:900;color:#64748b">${t}</small><svg viewBox="0 0 180 70" style="width:100%;height:62px;margin-top:8px"><polyline points="${i===0?"10,18 50,28 90,34 130,42 170,50":"10,52 50,44 90,34 130,26 170,16"}" fill="none" stroke="${quiet?"#64748b":"#2563eb"}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`).join("")}</div>${group?`<div class=main-card><small>Structure</small><strong>Cards are grouped into Study, Support, Wellbeing and Campus.</strong></div>`:""}</div>`}
function report(){const headline=has("student-headline"),highlight=has("highlight-rent"),labels=has("group-labels"),repaired=headline||highlight||labels,data=[["Rent",620,"#2563eb"],["Food",240,"#10b981"],["Going out",130,"#f59e0b"],["Transport",90,"#8b5cf6"],["Savings",80,"#14b8a6"],["Subscriptions",55,"#f43f5e"]],total=1215,pie=highlight?"conic-gradient(#2563eb 0 51%,#10b981 51% 71%,#f59e0b 71% 82%,#8b5cf6 82% 90%,#14b8a6 90% 96%,#f43f5e 96% 100%)":"conic-gradient(#94a3b8 0 51%,#cbd5e1 51% 71%,#a7b4c5 71% 82%,#d6dee8 82% 90%,#9aa8ba 90% 96%,#c7d2e1 96% 100%)";return`<div class=visual><h2>Monthly Student Budget</h2><p>${repaired?"Student view":"Finance-style view"} - total EUR ${total}</p>${headline?`<div class=main-card><small>Main takeaway</small><strong>Rent takes the biggest part of the budget.</strong><div style="margin-top:8px;font-weight:900;color:#64748b">Rent is 51% of this monthly budget.</div></div>`:""}<div style="display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:22px"><div class=score style="display:grid;place-items:center;border-radius:28px"><div style="width:260px;height:260px;border-radius:50%;background:${pie};display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(15,23,42,.06)"><div style="width:150px;height:150px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center;box-shadow:0 12px 30px rgba(15,23,42,.15)"><div><small style="font-weight:900;color:#64748b;text-transform:uppercase">${highlight?"Biggest part":"Largest code"}</small><strong style="display:block;font-size:38px;color:#0f172a">Rent</strong><b style="font-size:25px;color:#1d4ed8">51%</b></div></div></div></div><div class=score>${data.map(d=>`<div style="display:grid;grid-template-columns:18px 1fr 86px;gap:12px;align-items:center;background:${highlight&&d[0]==="Rent"?"#eff6ff":"#f8fafc"};border-radius:10px;padding:12px;margin-bottom:10px"><span style="width:16px;height:16px;border-radius:50%;background:${highlight||labels?d[2]:d[0]==="Rent"?"#94a3b8":"#cbd5e1"}"></span><b>${d[0]}</b><strong style="text-align:right">${labels||d[0]==="Rent"?"EUR "+d[1]:"EUR ..."}</strong></div>`).join("")}<div class=feedback>${labels?"Use this view to decide where savings are possible.":"The data is correct, but the main spending story is hidden."}</div></div></div></div>`}
function titleCase(){const careful=has("careful-headline"),red=has("red-warning"),hide=has("remove-dots"),title=careful?"More screen time is linked to lower grades":"Phones are destroying grades",pts=[[12,18],[22,24],[32,31],[42,39],[52,48],[62,58],[72,64],[82,72],[90,78],[96,84]],line=red?"#dc2626":careful?"#0f766e":"#0f172a";return`<div class=visual><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><small style="font-weight:900;color:#64748b;text-transform:uppercase">${careful?"Careful story":"Draft story"}</small><h2>${title}</h2><p>Screen time per day vs. grade score</p></div><div style="background:${careful?"#d1fae5":"#fef3c7"};color:${careful?"#065f46":"#92400e"};border-radius:10px;padding:8px 12px;font-weight:900">${careful?"linked, not caused":"claim too strong"}</div></div><div class=scatter><div class=trend style="background:${line}"></div>${hide?"":pts.map(p=>`<div class=dot style="left:${p[0]}%;top:${p[1]}%"></div>`).join("")}<div style="position:absolute;left:10px;top:10px;font-weight:900;color:#64748b">Grade</div><div style="position:absolute;right:14px;bottom:10px;font-weight:900;color:#64748b">Screen time</div><div style="position:absolute;left:67%;top:54%;font-weight:900;color:#0f172a;background:white;border:1px solid #e2e8f0;border-radius:8px;padding:6px 9px;z-index:4">visible relationship</div></div>${has("cause-note")?`<div class=feedback>This shows a relationship, not proof of cause and effect.</div>`:""}</div>`}
function club(){const show=has("add-capacity")||has("fair-note"),clubs=[["Football",120,200],["Music",65,100],["Art",45,50],["Chess",30,40]].sort((a,b)=>show?b[1]/b[2]-a[1]/a[2]:0),max=120;return`<div class=visual><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><h2>Student Club Popularity</h2><p>${show?"Capacity view":"Raw member view"}</p></div><div style="background:#0f172a;color:white;border-radius:10px;padding:8px 12px;font-weight:900">${show?"fairer comparison":"raw totals"}</div></div><div style="display:grid;gap:14px;margin-top:24px">${clubs.map(c=>{const pct=Math.round(c[1]/c[2]*100);return`<div class=score style="${show&&c[0]==="Art"?"border-color:#86efac;background:#ecfdf5":""}"><div style="display:grid;grid-template-columns:110px 1fr 92px;gap:14px;align-items:center"><div><strong style="font-size:22px">${c[0]}</strong><div style="font-weight:900;color:#64748b">${show?`${c[1]} / ${c[2]}`:"members"}</div></div><div style="height:38px;background:#e2e8f0;border-radius:999px;overflow:hidden"><div style="height:100%;width:${show?pct:c[1]/max*100}%;background:${show&&c[0]==="Art"?"#059669":"#2563eb"};border-radius:999px"></div></div><div style="text-align:right"><strong style="font-size:24px">${show?pct+"%":c[1]}</strong>${show?`<div style="font-size:12px;font-weight:900;color:#64748b">full</div>`:""}</div></div></div>`}).join("")}</div>${has("fair-note")?`<div class=feedback style="margin-top:16px">Raw members show size. Capacity shows how full each club is.</div>`:""}</div>`}
function cafeteria(){const manager=has("manager-priority-board"),data=[["Waiting time",48,"Priority 1","#fff1f2","62%","12%"],["Healthy options",55,"Priority 2","#fffbeb","56%","58%"],["Price fairness",61,"Monitor","#eff6ff","18%","58%"],["Food quality",72,"Keep strong","#ecfdf5","16%","18%"]];return`<div class=visual><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><h2>Cafeteria Feedback</h2><p>${manager?"Manager priority matrix":"Equal feedback cards"}</p></div>${has("show-sample")?`<div style="background:#0f172a;color:white;border-radius:10px;padding:8px 12px;font-weight:900">n = 312</div>`:""}</div>${manager?`<div class=main-card><small>Main action</small><strong>Reduce waiting time first.</strong></div>`:""}${!manager?`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px">${data.map(d=>`<div class=score><strong style="font-size:20px">${d[0]}</strong><div style="font-size:42px;font-weight:900;margin-top:10px;color:#0f172a">${d[1]}%</div><div style="font-weight:900;color:#64748b">Survey score</div></div>`).join("")}</div>`:`<div class=score style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:14px"><div><strong style="font-size:25px">Priority matrix</strong><div style="font-weight:800;color:#64748b">Low score + high impact should move first.</div></div><span style="background:#f1f5f9;border-radius:8px;padding:8px 10px;font-weight:900;color:#475569">PowerBI style</span></div><div style="position:relative;height:360px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:linear-gradient(90deg,#eff6ff 0 50%,#fff7ed 50% 100%)"><div style="position:absolute;left:50%;top:0;width:1px;height:100%;background:#cbd5e1"></div><div style="position:absolute;left:0;top:50%;width:100%;height:1px;background:#cbd5e1"></div><div style="position:absolute;left:14px;top:14px;font-size:12px;font-weight:900;color:#64748b;text-transform:uppercase">High impact</div><div style="position:absolute;right:14px;bottom:14px;font-size:12px;font-weight:900;color:#64748b;text-transform:uppercase">Needs action</div>${data.map(d=>`<div style="position:absolute;left:${d[4]};top:${d[5]};width:180px;border:1px solid #dbe3ee;border-radius:10px;background:${d[3]};padding:14px;box-shadow:0 10px 25px rgba(15,23,42,.09)"><small style="font-weight:900;color:#64748b;text-transform:uppercase">${d[2]}</small><strong style="display:block;margin-top:4px;font-size:19px;color:#0f172a">${d[0]}</strong><b style="display:block;margin-top:6px;font-size:32px;color:#0f172a">${d[1]}%</b></div>`).join("")}</div></div>`}${has("show-sample")?`<p style="font-weight:900;color:#64748b">Sample info kept visible in small text.</p>`:""}</div>`}
function ranking(){const careful=has("uncertainty"),remove=has("remove-winner"),data=[["Library",82,4],["Cafeteria",80,4],["Sports",79,5],["Study rooms",78,4]],scale=v=>(v-70)/20*100;return`<div class=visual><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><h2>Student Satisfaction Ranking</h2><p>${careful?"Uncertainty range view":"Ranked KPI cards"}</p></div>${!careful&&!remove?`<div style="background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 12px;font-weight:900">clear winner?</div>`:""}</div>${!careful?`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px">${data.map((d,i)=>`<div class=score style="${i===0&&!remove?"border-color:#fcd34d;background:#fffbeb":""}"><div style="display:flex;justify-content:space-between;align-items:center"><small style="font-weight:900;color:#64748b;text-transform:uppercase">Rank ${i+1}</small>${i===0&&!remove?`<span style="background:#fde68a;color:#92400e;border-radius:999px;padding:5px 10px;font-weight:900;font-size:12px">winner</span>`:""}</div><strong style="display:block;margin-top:12px;font-size:25px;color:#0f172a">${d[0]}</strong><b style="display:block;margin-top:8px;font-size:52px;color:#0f172a">${d[1]}%</b></div>`).join("")}</div>`:`<div class=score style="margin-top:24px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:20px"><div><strong style="font-size:25px">Uncertainty range view</strong><div style="font-weight:800;color:#64748b">The ranges overlap, so the exact order is not certain.</div></div><span style="background:#f1f5f9;border-radius:8px;padding:8px 10px;font-weight:900;color:#475569">70-90%</span></div>${data.map(d=>{const left=scale(d[1]-d[2]),width=scale(d[1]+d[2])-left;return`<div style="display:grid;grid-template-columns:120px 1fr 58px;gap:14px;align-items:center;margin:22px 0"><b>${d[0]}</b><div style="height:48px;background:#f8fafc;border-radius:10px;position:relative"><div style="position:absolute;left:0;top:50%;width:100%;height:1px;background:#e2e8f0"></div><div style="position:absolute;left:${left}%;top:18px;width:${width}%;height:12px;background:#dbeafe;border-radius:999px"></div><div style="position:absolute;left:${scale(d[1])}%;top:12px;width:24px;height:24px;margin-left:-12px;background:#1d4ed8;border:4px solid white;border-radius:50%;box-shadow:0 6px 18px rgba(15,23,42,.25)"></div>${[70,75,80,85,90].map(t=>`<span style="position:absolute;left:${scale(t)}%;top:34px;transform:translateX(-50%);font-size:10px;font-weight:900;color:#94a3b8">${t}</span>`).join("")}</div><strong style="font-size:22px;text-align:right">${d[1]}%</strong></div>`}).join("")}</div>`}${has("careful-message")?`<div class=main-card><small>Careful message</small><strong>The scores are close. The exact ranking may not be meaningful.</strong></div>`:""}</div>`}
function render(){const l=levels[state.level];app.innerHTML=`<main class=page><header class="card top"><div class=top-inner><div class=top-row><div><p class=eyebrow>Level ${state.level+1} of ${levels.length}</p><h1>Fix the Visual Lab</h1><p class=subtitle>Repair the story, not only the chart.</p></div><div class="card case"><small>${l.cat}</small><strong>${l.title}</strong><span>${l.theme}</span></div></div>${attemptSummary()}<div class=levelnav>${levels.map((lv,i)=>`<button class="${i===state.level?"active":""}" onclick="jump(${i})">${i+1}. ${lv.cat.replace(" Check","")}</button>`).join("")}</div></div></header><section class=layout><div class="card visual-wrap"><div class=brief><small>Main question</small><div>${l.prompt}</div></div><div class=context>${l.context}</div><div class=goal><small>Goal</small>${l.goal}</div>${visual()}</div><div style="display:grid;gap:16px">${side(l)}</div></section></main>`}
function final(){const t=totals();const report=levels.map(l=>`<div class=score style=text-align:left><small>${l.title}</small><strong style="display:block;font-size:18px;margin-top:8px">${choiceEntries(l).filter(x=>state.choices[key(l.id,x.group)]===x.o[0]).map(x=>x.o[1]).join("<br>")||"No choices selected"}</strong></div>`).join("");app.innerHTML=`<main class=final><section class=card><div class=ok style="width:auto;padding:0 18px;border-radius:12px">Good choice</div><h1>Final result: You repaired the visual stories.</h1><p class=subtitle>Small design choices can change what people believe.</p><div class=attempts style="justify-content:center;margin-top:28px"><div class="attempt good">Helpful choices <b>${t.good}</b></div><div class="attempt bad">Less useful choices <b>${t.wrong}</b></div><div class=attempt>Fit score <b>${t.accuracy}%</b></div></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:900px;margin:18px auto">${report}</div><button class="btn primary" onclick="state.level=0;state.applied=[];state.order=[];state.choices={};state.feedback='';state.result=false;state.scores=[];state.attempts={};state.appliedBy={};state.resultBy={};state.orderBy={};state.order=levelOrder(levels[0]);render()">Play again</button></section></main>`}
render();
</script>
</body>
</html>
